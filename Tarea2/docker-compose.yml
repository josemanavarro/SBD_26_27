services:
  minio:
    image: coollabsio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: sbd_minio
    restart: unless-stopped
    ports:
     - "9000:9000"
     - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: Alandalus2627
    command: server /data --console-address ":9001"
    volumes:
     - ./minio_data:/data
    networks:
     - lakehouse_net

  postgres:
    image: postgres:17-alpine
    container_name: sbd_postgres
    restart: unless-stopped
    ports:
     - "5432:5432"    
    environment:
     POSTGRES_USER: sbd_user
     POSTGRES_PASSWORD: Alandalus2627
     POSTGRES_DB: dwh_electronova
    volumes: 
     - ./pg_data:/var/lib/postgresql/data
    networks:
     - lakehouse_net
    depends_on:
     - minio

  python-etl:
    build: .
    container_name: sbd_python_etl
    restart: unless-stopped
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_HOST: minio:9000
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: Alandalus2627
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: dwh_electronova
      PG_USER: sbd_user
      PG_PASSWORD: Alandalus2627
    volumes:
     - ./app:/app
    networks:
     - lakehouse_net
    depends_on:
     - postgres

networks:
  lakehouse_net:
    driver: bridge
